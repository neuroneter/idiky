  <g fill="none" stroke-width="13" stroke-linejoin="round" stroke-linecap="round">
    <path d="M48 132V76l48-32 48 32v56" stroke="#1d2e7a"/>
    <path d="M78 132V98h36v34" stroke="#c41e8c"/>
    <path d="M36 138h120" stroke="#1d2e7a"/>
  </g>
  <text x="188" y="129" fill="#1d2e7a" font-size="123" font-weight="720" letter-spacing="-5.5"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">idiky</text>
</svg>
