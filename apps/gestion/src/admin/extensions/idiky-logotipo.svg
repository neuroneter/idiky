<!-- Logotipo de IDIKY para el login del sistema de gestion (T-37).
     La casa es la misma geometria de apps/pwa/src/componentes/Logotipo.tsx y de
     apps/pwa/public/icono.svg: si Mary cambia el logo alla, se cambia aqui tambien.
     Azul #1d2e7a (color-marca) y puerta fucsia #c41e8c (color-marca-claro).
     OJO: un comentario XML no puede llevar dos guiones seguidos; si los lleva, el SVG
     queda invalido y el navegador no lo dibuja. -->
