<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Idiky Contable — Cartera y pagos</title>
    <meta name="description" content="Modulo de cartera, pagos y recibos de caja para la administracion de una copropiedad." />
    <!--
      El icono va incrustado como SVG y no como archivo: asi no hay una peticion
      mas, y el navegador deja de pedir /favicon.ico — que en un servidor queda
      registrado como un 404 en cada visita.
    -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23152046'/><circle cx='32' cy='16' r='6' fill='%23b51f88'/><rect x='26' y='26' width='12' height='25' rx='3' fill='%23ffffff'/></svg>" />
    <link rel="stylesheet" href="estilos/app.css" />
  </head>
  <body>
    <div class="aplicacion">
      <aside class="lateral">
        <div class="lateral__marca">
          <span class="lateral__nombre">idiky</span>
          <span class="lateral__producto">Contable</span>
        </div>

        <nav class="nav" id="navegacion" aria-label="Modulos"></nav>

        <div class="lateral__copropiedad">
          <span id="nombre-copropiedad">—</span>
          <span id="nit-copropiedad"></span>
        </div>

        <div class="lateral__pie">
          <strong id="usuario">—</strong>
          Administradora
        </div>
      </aside>

      <main class="area">
        <header class="cabecera" id="cabecera"></header>
        <div class="contenido" id="contenido"></div>
      </main>
    </div>

    <div id="avisos" role="status" aria-live="polite"></div>

    <!--
      El orden importa: cada archivo usa lo que definieron los anteriores.
      Se cargan como scripts clasicos a proposito — los modulos de JavaScript
      (import/export) los bloquea el navegador al abrir un archivo desde el
      disco, y esta aplicacion tiene que funcionar con doble clic.
    -->
    <script src="js/formato.js"></script>
    <script src="js/dominio.js"></script>
    <script src="js/puc.js"></script>
    <script src="js/proveedores.js"></script>
    <script src="js/datos.js"></script>
    <script src="js/contabilidad.js"></script>
    <script src="js/repositorio.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/editor-imputacion.js"></script>
    <script src="js/vista-cartera.js"></script>
    <script src="js/vista-pagos.js"></script>
    <script src="js/vista-recibos.js"></script>
    <script src="js/vista-gastos.js"></script>
    <script src="js/vista-egresos.js"></script>
    <script src="js/vista-ajustes.js"></script>
    <script src="js/vista-plan.js"></script>
    <script src="js/vista-contabilidad.js"></script>
    <script src="js/vista-reportes.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
