<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototipo · Arma tu copropiedad (arrastrar y configurar)</title>
<link rel="stylesheet" href="tokens.css">
<style>
  *{box-sizing:border-box} body{margin:0;font-family:var(--fuente);color:var(--color-texto);background:var(--color-fondo);user-select:none}
  .arma{height:100vh;display:grid;grid-template-columns:1fr 380px}
  .lienzo{position:relative;background:var(--degradado-marca-vertical);color:#fff;overflow:hidden;display:flex;flex-direction:column}
  .cab{display:flex;align-items:center;justify-content:space-between;padding:22px 32px 0}
  .producto{font-weight:800;letter-spacing:.06em}
  .avance{display:flex;align-items:center;gap:12px;font-size:14px}
  .anillo{width:44px;height:44px;border-radius:50%;background:conic-gradient(var(--color-marca-claro) var(--p,0%), rgba(255,255,255,.2) 0);display:grid;place-items:center}
  .anillo span{width:34px;height:34px;border-radius:50%;background:var(--color-marca);display:grid;place-items:center;font-size:11px;font-weight:700}
  .nombre{margin:18px 32px 0;font-size:22px;font-weight:700}
  .resumen{margin:2px 32px 0;opacity:.85;font-size:14px}
  /* El terreno: una cuadricula donde se sueltan las cosas. */
  .terreno{position:relative;flex:1;margin:18px 32px 28px;border:2px dashed rgba(255,255,255,.35);border-radius:16px;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:40px 40px}
  .terreno.sobre{border-color:var(--color-marca-claro);background-color:rgba(255,255,255,.06)}
  .terreno__vacio{position:absolute;inset:0;display:grid;place-items:center;text-align:center;opacity:.8;font-size:16px;padding:40px;pointer-events:none}
  .terreno__vacio small{display:block;opacity:.8;margin-top:8px;font-size:13px}
  .obj{position:absolute;transform:translate(-50%,-100%);cursor:grab;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px;border-radius:8px;transition:transform .05s}
  .obj:active{cursor:grabbing}
  .obj.sel{outline:2px dashed rgba(255,255,255,.85);outline-offset:2px;background:rgba(255,255,255,.06)}
  .obj__nombre{font-size:11px;white-space:nowrap;opacity:.95}
  .obj__sub{font-size:10px;opacity:.7;white-space:nowrap}
  .torre{width:80px;display:flex;flex-direction:column-reverse;gap:3px}
  .piso{height:16px;border:2px solid rgba(255,255,255,.8);border-radius:3px;background:rgba(255,255,255,.12);display:flex;gap:2px;padding:2px;animation:sube .3s ease-out both}
  .piso i{flex:1;background:rgba(255,255,255,.4);border-radius:1px}
  .piso--local i{background:var(--color-marca-claro)}
  .techo{height:12px;border:2px solid rgba(255,255,255,.8);border-bottom:0;border-radius:8px 8px 0 0;width:60%;margin:0 auto}
  .casa{width:54px;height:40px;border:2px solid rgba(255,255,255,.8);border-radius:4px;position:relative;background:rgba(255,255,255,.12);margin-top:14px}
  .casa::before{content:"";position:absolute;left:-2px;right:-2px;top:-14px;height:14px;border:2px solid rgba(255,255,255,.8);border-bottom:0;border-radius:10px 10px 0 0}
  .pin{width:56px;height:56px;border-radius:14px;border:2px solid rgba(255,255,255,.8);background:rgba(255,255,255,.14);display:grid;place-items:center}
  .pin svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
  .pin.zona{width:72px;height:50px;border-radius:10px;background:rgba(196,30,140,.28);border-color:rgba(255,255,255,.7)}
  @keyframes sube{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
  .panel{background:var(--color-superficie);display:flex;flex-direction:column;border-left:1px solid var(--color-borde);min-height:0}
  .pestanas{display:flex;border-bottom:1px solid var(--color-borde);padding:0 16px}
  .pestanas button{flex:1;padding:16px 4px 12px;border:0;background:none;font:inherit;font-weight:600;font-size:14px;color:var(--color-texto-suave);border-bottom:3px solid transparent;cursor:pointer}
  .pestanas button[aria-selected=true]{color:var(--color-marca);border-bottom-color:var(--color-marca-claro)}
  .ayuda{padding:12px 20px 4px;color:var(--color-texto-suave);font-size:13px;margin:0}
  .catalogo{padding:12px 20px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;overflow:auto}
  .objeto{border:1.5px solid var(--color-borde);border-radius:12px;padding:12px 6px 10px;background:var(--color-superficie-2);text-align:center;cursor:grab;display:flex;flex-direction:column;align-items:center;gap:6px}
  .objeto:hover{border-color:var(--color-marca);background:var(--color-marca-suave)}
  .objeto:active{cursor:grabbing}
  .objeto svg{width:38px;height:38px;stroke:var(--color-marca);fill:none;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
  .objeto strong{font-size:12px}
  .objeto span{font-size:10px;color:var(--color-texto-tenue)}
  .inspector{margin:auto 16px 12px;border:1px solid var(--color-borde);border-radius:14px;padding:14px 16px;background:var(--color-superficie-2);box-shadow:var(--sombra-1)}
  .inspector h2{margin:0;font-size:16px;display:flex;justify-content:space-between;align-items:center}
  .inspector h2 button{border:0;background:none;color:var(--color-marca);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .inspector .sub{font-size:12px;color:var(--color-texto-tenue);margin:2px 0 8px}
  .fila{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--color-borde);font-size:14px}
  .stepper{display:flex;align-items:center;gap:8px}
  .stepper button{width:32px;height:32px;border-radius:50%;border:1px solid var(--color-borde-fuerte);background:#fff;font-size:18px;cursor:pointer;color:var(--color-marca)}
  .stepper output{min-width:34px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
  .interruptor{width:36px;height:20px;border-radius:999px;background:#c9cbdf;position:relative;cursor:pointer;border:0}
  .interruptor[aria-checked=true]{background:var(--color-acento)}
  .interruptor::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
  .interruptor[aria-checked=true]::after{left:19px}
  .acciones{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .boton{min-height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--color-borde-fuerte);background:#fff;font:inherit;font-weight:600;cursor:pointer;font-size:12px}
  .boton--peligro{color:var(--color-error);border-color:var(--color-error-suave);background:var(--color-error-suave)}
  .pie{padding:12px 20px 16px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--color-borde);font-size:12px;color:var(--color-texto-suave)}
  .pie a{color:var(--color-marca);font-weight:600}
  .aviso{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);background:rgba(23,25,53,.85);color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
  .aviso.ver{opacity:1}
</style>
</head>
<body>
<div class="arma">
  <section class="lienzo">
    <div class="cab"><span class="producto">BLOKY</span><span class="avance"><span class="anillo" id="anillo"><span id="pct">0 %</span></span> Tu copropiedad</span></div>
    <div class="nombre">Conjunto Residencial Altos del Bosque</div>
    <div class="resumen" id="resumen">Arrastra del catálogo al terreno.</div>
    <div class="terreno" id="terreno">
      <div class="terreno__vacio" id="vacio">Este es el terreno de tu copropiedad.<small>Arrastra una torre, una manzana o una zona común desde la derecha y suéltala donde va. Luego tócala para configurarla.</small></div>
    </div>
    <div class="aviso" id="aviso"></div>
  </section>
  <aside class="panel">
    <div class="pestanas" id="pestanas"></div>
    <p class="ayuda" id="ayuda"></p>
    <div class="catalogo" id="catalogo"></div>
    <div id="inspector"></div>
    <div class="pie"><span id="conteo"></span><span>¿Ya lo tienes en Excel? <a href="#">Importar</a></span></div>
  </aside>
</div>
<script>
const I = {
  torre:'<svg viewBox="0 0 24 24"><path d="M6 21V5l6-3 6 3v16M9 9h1M14 9h1M9 13h1M14 13h1M9 17h1M14 17h1M3 21h18"/></svg>',
  manzana:'<svg viewBox="0 0 24 24"><path d="M2 21v-7l4-3 4 3v7M10 21v-8l4-3 4 3v8M1 21h22M5 21v-3h2v3M13 21v-3h2v3"/></svg>',
  local:'<svg viewBox="0 0 24 24"><path d="M3 10h18v11H3zM3 10l2-5h14l2 5M9 21v-6h6v6M6 10v2M12 10v2M18 10v2"/></svg>',
  parqueadero:'<svg viewBox="0 0 24 24"><path d="M4 21V3h16v18M9 16V8h4a2.5 2.5 0 0 1 0 5H9"/></svg>',
  deposito:'<svg viewBox="0 0 24 24"><path d="M3 9l9-5 9 5v12H3zM9 21v-8h6v8M12 13v8"/></svg>',
  porteria:'<svg viewBox="0 0 24 24"><path d="M5 21V9l7-5 7 5v12M10 21v-6h4v6M2 21h20M12 8v2"/></svg>',
  salon:'<svg viewBox="0 0 24 24"><path d="M3 21V9h18v12M3 9l9-5 9 5M7 15h10M7 18h10"/></svg>',
  piscina:'<svg viewBox="0 0 24 24"><path d="M2 15c2-2 4-2 6 0s4 2 6 0 4-2 6 0M2 19c2-2 4-2 6 0s4 2 6 0 4-2 6 0M8 12V5a2 2 0 0 1 4 0M14 12V5a2 2 0 0 1 4 0"/></svg>',
  gimnasio:'<svg viewBox="0 0 24 24"><path d="M2 12h3M19 12h3M5 8v8M19 8v8M8 6v12M16 6v12M8 12h8"/></svg>',
  parque:'<svg viewBox="0 0 24 24"><path d="M12 21v-6M12 15l-5-4 5-8 5 8zM3 21h18"/></svg>',
  entrada:'<svg viewBox="0 0 24 24"><path d="M3 21V7h8v14M11 21V3h10v18M6 14h1M15 8h2M15 12h2M15 16h2"/></svg>',
};
const NOMBRE = { torre:'Torre', manzana:'Manzana', local:'Locales', parqueadero:'Parqueaderos', deposito:'Depósitos', porteria:'Portería', salon:'Salón social', piscina:'Piscina', gimnasio:'Gimnasio', parque:'Parque infantil', entrada:'Entrada vehicular' };
const CATALOGO = {
  Estructura: { ayuda:'Arrastra al terreno. Luego tócala para decir cuántos pisos y apartamentos tiene.', objetos:['torre','manzana','local'] },
  Espacios:   { ayuda:'Parqueaderos y depósitos llevan cantidad; las zonas comunes se sueltan donde están.', objetos:['parqueadero','deposito','porteria','salon','piscina','gimnasio','parque','entrada'] },
};
const estado = { pestana:'Estructura', objetos:[], sel:null };
const $ = (s)=>document.querySelector(s);
let contador = { torre:0, manzana:0, local:0 };
function crear(tipo, x, y){
  const base = { id: Date.now()+Math.random(), tipo, x, y };
  if (tipo==='torre') { contador.torre++; return { ...base, nombre:'Torre '+contador.torre, pisos:6, porPiso:4, locales:false }; }
  if (tipo==='manzana') { contador.manzana++; return { ...base, nombre:'Manzana '+contador.manzana, casas:8 }; }
  if (tipo==='local') { contador.local++; return { ...base, nombre:'Locales', n:4 }; }
  if (tipo==='parqueadero'||tipo==='deposito') return { ...base, nombre:NOMBRE[tipo], n: tipo==='parqueadero'?40:20 };
  return { ...base, nombre:NOMBRE[tipo] };
}
function unidades(){ return estado.objetos.reduce((a,o)=> a + (o.tipo==='torre'? o.pisos*o.porPiso : o.tipo==='manzana'? o.casas : o.tipo==='local'? o.n : 0), 0); }
function aviso(t){ const a=$('#aviso'); a.textContent=t; a.classList.add('ver'); clearTimeout(aviso.t); aviso.t=setTimeout(()=>a.classList.remove('ver'),1800); }
// ---- arrastrar desde el catalogo y dentro del terreno (HTML5 drag & drop; en el producto real, eventos de puntero para tactil)
const terreno = $('#terreno');
terreno.addEventListener('dragover', (e)=>{ e.preventDefault(); terreno.classList.add('sobre'); });
terreno.addEventListener('dragleave', ()=> terreno.classList.remove('sobre'));
terreno.addEventListener('drop', (e)=>{
  e.preventDefault(); terreno.classList.remove('sobre');
  const r = terreno.getBoundingClientRect();
  const x = Math.round((e.clientX - r.left)/40)*40, y = Math.round((e.clientY - r.top)/40)*40;
  const datos = e.dataTransfer.getData('text/plain');
  if (datos.startsWith('nuevo:')) { const o = crear(datos.slice(6), x, y); estado.objetos.push(o); estado.sel=o.id; aviso(`${o.nombre} agregada. Tócala para configurarla.`); }
  else { const o = estado.objetos.find(z=>String(z.id)===datos); if (o) { o.x=x; o.y=y; } }
  render();
});
function render(){
  $('#pestanas').innerHTML = Object.keys(CATALOGO).map(k=>`<button role="tab" aria-selected="${estado.pestana===k}" onclick="estado.pestana='${k}';render()">${k}</button>`).join('');
  $('#ayuda').textContent = CATALOGO[estado.pestana].ayuda;
  $('#catalogo').innerHTML = CATALOGO[estado.pestana].objetos.map(id=>`<div class="objeto" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','nuevo:${id}')" ondblclick="const o=crear('${id}', 120+estado.objetos.length*90, 300); estado.objetos.push(o); estado.sel=o.id; render()">${I[id]}<strong>${NOMBRE[id]}</strong><span>arrastra</span></div>`).join('');
  // terreno
  terreno.querySelectorAll('.obj').forEach(n=>n.remove());
  $('#vacio').style.display = estado.objetos.length? 'none':'grid';
  for (const o of estado.objetos) {
    const d=document.createElement('div'); d.className='obj'+(estado.sel===o.id?' sel':''); d.style.left=o.x+'px'; d.style.top=o.y+'px'; d.draggable=true;
    d.ondragstart=(e)=>e.dataTransfer.setData('text/plain',String(o.id)); d.onclick=()=>{estado.sel=o.id;render();};
    let cuerpo='';
    if (o.tipo==='torre') { const t=document.createElement('div'); t.className='torre'; for(let p=0;p<Math.min(o.pisos,8);p++){ const piso=document.createElement('div'); piso.className='piso'+(p===0&&o.locales?' piso--local':''); piso.style.animationDelay=(p*25)+'ms'; for(let u=0;u<Math.min(o.porPiso,6);u++) piso.appendChild(document.createElement('i')); t.appendChild(piso);} const techo=document.createElement('div'); techo.className='techo'; t.appendChild(techo); d.appendChild(t); cuerpo=`${o.pisos} pisos × ${o.porPiso}`; }
    else if (o.tipo==='manzana') { const c=document.createElement('div'); c.className='casa'; d.appendChild(c); cuerpo=`${o.casas} casas`; }
    else { const p=document.createElement('div'); p.className='pin'+(['parqueadero','deposito','local'].includes(o.tipo)?' zona':''); p.innerHTML=I[o.tipo]; d.appendChild(p); cuerpo = o.n? `${o.n}` : ''; }
    const n=document.createElement('div'); n.className='obj__nombre'; n.textContent=o.nombre; d.appendChild(n);
    if (cuerpo) { const s=document.createElement('div'); s.className='obj__sub'; s.textContent=cuerpo; d.appendChild(s); }
    terreno.appendChild(d);
  }
  const u=unidades(); const torres=estado.objetos.filter(o=>o.tipo==='torre').length, manz=estado.objetos.filter(o=>o.tipo==='manzana').length;
  $('#resumen').textContent = estado.objetos.length ? [torres&&`${torres} torres`, manz&&`${manz} manzanas`, `${u} unidades`].filter(Boolean).join(' · ') : 'Arrastra del catálogo al terreno.';
  const pct=Math.min(60, u>0? 20+Math.min(40,Math.round(u/3)) : (estado.objetos.length?8:0)); $('#anillo').style.setProperty('--p',pct+'%'); $('#pct').textContent=pct+' %';
  $('#conteo').textContent = u? `${u} unidades hasta ahora` : 'Nada todavía';
  // inspector
  const o = estado.objetos.find(z=>z.id===estado.sel);
  let html='';
  if (o) {
    html = `<div class="inspector"><h2>${o.nombre} <button onclick="const n=prompt('Nombre','${o.nombre}'); if(n){objeto(${JSON.stringify(String(o.id))}).nombre=n;render()}">Renombrar</button></h2><div class="sub">Arrástrala para moverla. Puedes cambiarlo después.</div>`;
    if (o.tipo==='torre') html += fila('Pisos','pisos',o) + fila('Apartamentos por piso','porPiso',o) + `<div class="fila"><span>Locales en el primer piso</span><button class="interruptor" role="switch" aria-checked="${o.locales}" onclick="objeto('${o.id}').locales=!${o.locales};render()"></button></div>`;
    else if (o.tipo==='manzana') html += fila('Casas','casas',o);
    else if (o.n!==undefined) html += fila('Cantidad','n',o);
    html += `<div class="acciones">${(o.tipo==='torre'||o.tipo==='manzana')?`<button class="boton" onclick="const c={...objeto('${o.id}'), id:Date.now(), x:objeto('${o.id}').x+120, nombre:(objeto('${o.id}').tipo==='torre'?'Torre ':'Manzana ')+(++contador[objeto('${o.id}').tipo])}; estado.objetos.push(c); estado.sel=c.id; render()">Duplicar</button>`:''}<button class="boton boton--peligro" onclick="estado.objetos=estado.objetos.filter(z=>String(z.id)!=='${o.id}');estado.sel=null;render()">Quitar</button></div></div>`;
  }
  $('#inspector').innerHTML = html;
}
function objeto(id){ return estado.objetos.find(z=>String(z.id)===String(id)); }
function fila(titulo, clave, o){ return `<div class="fila"><span>${titulo}</span><span class="stepper"><button onclick="objeto('${o.id}').${clave}=Math.max(1,objeto('${o.id}').${clave}-1);render()">−</button><output>${o[clave]}</output><button onclick="objeto('${o.id}').${clave}++;render()">+</button></span></div>`; }
if (location.hash==='#demo') {
  estado.objetos = [ {...crear('torre',160,330), locales:true}, crear('torre',290,330), {...crear('torre',420,300), pisos:8, porPiso:3}, crear('parqueadero',640,330), crear('porteria',80,470), crear('piscina',560,470), crear('salon',680,470), crear('parque',440,470) ];
  estado.sel = estado.objetos[2].id; estado.pestana='Espacios';
}
render();
</script>
</body>
</html>
