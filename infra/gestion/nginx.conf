# nginx del pod del sistema de gestion (T-37 · ADR-0012).
#
# Es el UNICO contenedor del pod con puerto hacia afuera. Strapi (1337) y PostgreSQL (5432)
# escuchan solo dentro del pod, y se alcanzan por localhost porque el pod comparte la red.
#
# SIN la clave del entorno: el panel de Strapi manda su propio token en la cabecera
# Authorization, la misma que usa auth_basic, y la clave lo romperia. La puerta es el login de
# Strapi (ADR-0012).
server {
    listen 80;
    server_name _;
    server_tokens off;

    # Archivos de la biblioteca de medios de Strapi.
    client_max_body_size 50m;

    location = /salud {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /revision.txt {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # Registro abierto de usuarios finales: Strapi lo trae encendido y este sistema no tiene
    # usuarios finales. Se apaga tambien en el bootstrap de Strapi; esto es la segunda cerradura.
    location = /api/auth/local/register {
        return 403;
    }

    location / {
        proxy_pass http://127.0.0.1:1337;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
