# nginx del pod de Jitsi (T-78 · ADR-0016).
#
# Es el UNICO contenedor del pod con puerto hacia afuera. jitsi/web escucha en el 8000 y
# prosody (5222, 5280) y el videobridge (8080 de estadisticas) solo dentro del pod, que
# comparte la red: se alcanzan por 127.0.0.1.
#
# SIN la clave del entorno, por la misma razon que BOB (README §2): Jitsi habla por WebSocket
# (/xmpp-websocket y /colibri-ws) y por tokens, y auth_basic lo romperia. La puerta es el
# login de Jitsi: sin cuenta no se puede ABRIR una sala (ENABLE_AUTH=1, AUTH_TYPE=internal).
#
# El video NO pasa por aqui: va en UDP directo al videobridge (10000/udp del pod).

map $http_upgrade $conexion_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    location = /salud {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /revision.txt {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        # Sin estas dos, el XMPP por WebSocket no se establece y nadie entra a la sala.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $conexion_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Una asamblea dura horas: el WebSocket no se puede cortar a los 60 s.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
