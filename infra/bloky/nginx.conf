# nginx del pod de BLOKY (T-75 · ADR-0011 · ADR-0013).
#
# Es el UNICO contenedor del pod con puerto hacia afuera. La API (3000) y PostgreSQL (5432)
# escuchan solo dentro del pod y se alcanzan por localhost.
#
# CON la clave del entorno (README §6): BLOKY usa una cookie, no la cabecera Authorization,
# asi que la clave no le estorba. Se quita cuando BLOKY tenga dominio y salga de desarrollo.
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/idiky/*.conf;

    location = /salud {
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /revision.txt {
        auth_basic off;
        add_header Cache-Control "no-cache";
    }

    # La salud de la API va SIN la clave del entorno, igual que /salud: levantar.sh la consulta
    # sin clave para saber que la API arranco. Solo dice ok, el entorno y los canales.
    location = /api/salud {
        auth_basic off;
        access_log off;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # La API. Google y Microsoft vuelven a /api/acceso/<proveedor>/retorno con el navegador,
    # que ya trae la clave del entorno guardada, asi que pasan.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Los archivos compilados llevan hash en el nombre: se pueden guardar mucho tiempo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # La app usa rutas del navegador (/ingreso, /ingreso/codigo): todo lo que no sea un
    # archivo vuelve a index.html, que nunca se guarda en cache.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
