# nginx de la contable dentro de su contenedor (T-35 · ADR-0011).
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    location = /salud {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # La contable no tiene compilacion ni hashes en los nombres (ADR-0010): sin esto el
    # navegador sigue usando el js/ de ayer despues de desplegar.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
