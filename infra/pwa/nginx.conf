# nginx de la PWA dentro de su contenedor (T-35 · ADR-0011).
# La app usa HashRouter y base './' (ver src/main.tsx y vite.config.ts): no hace falta
# redirigir rutas a index.html.
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    location = /salud {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Lo que decide que version ve el navegador no se guarda en cache: el entorno de
    # desarrollo cambia varias veces al dia.
    location = /index.html           { add_header Cache-Control "no-cache"; }
    location = /sw.js                { add_header Cache-Control "no-cache"; }
    # El mime.types de nginx no conoce .webmanifest y lo serviria como octet-stream.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }
    location = /revision.txt         { add_header Cache-Control "no-cache"; }

    # Vite pone un hash en cada nombre de assets/: si el archivo cambia, cambia el nombre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
