# nginx del pod de Evolution API (T-131 · ADR-0033).
#
# Unico contenedor del pod con puerto hacia afuera. Evolution (8080), PostgreSQL y Redis
# escuchan solo dentro del pod.
#
# SIN auth_basic del entorno: Evolution autentica con AUTHENTICATION_API_KEY en cabecera;
# la clave basica lo romperia (mismo criterio que BOB y Jitsi).
server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 50m;

    location = /salud {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /revision.txt {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
